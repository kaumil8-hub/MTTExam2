  "notes": [
    {
      "topic": "crispr",
      "title": "Foundations",
      "pages": "2",
      "text": "Genetic engineering deliberately modifies an organism by manipulating its genetic material."
    },
    {
      "topic": "crispr",
      "title": "Gene therapy",
      "pages": "3–4",
      "text": "Gene therapy can supply genetic information that allows cells to produce sufficient functional gene product and improve the deficient phenotype."
    },
    {
      "topic": "crispr",
      "title": "Gene correction",
      "pages": "5",
      "text": "Gene correction repairs the abnormal sequence; adding a separate functional copy is a different strategy."
    },
    {
      "topic": "crispr",
      "title": "Somatic therapy",
      "pages": "8–9",
      "text": "Somatic therapy targets body cells such as skin, blood, or bone marrow cells and is not intended to transmit the change to offspring."
    },
    {
      "topic": "crispr",
      "title": "Germline therapy",
      "pages": "8–9,52",
      "text": "Germline changes can pass to descendants, which creates ethical implications extending beyond the treated individual."
    },
    {
      "topic": "crispr",
      "title": "Ex vivo sequence",
      "pages": "10–11",
      "text": "Ex vivo therapy removes cells, modifies them outside the body, selects or expands corrected cells, and returns them to the patient."
    },
    {
      "topic": "crispr",
      "title": "Delivery selection",
      "pages": "11,13",
      "text": "In vivo delivery is useful when target cells cannot be cultured sufficiently or cannot be effectively reimplanted."
    },
    {
      "topic": "crispr",
      "title": "ADA-SCID",
      "pages": "12",
      "text": "The lecture's SCID example involves adenosine deaminase (ADA) deficiency and toxic deoxyadenosine accumulation that damages T lymphocytes."
    },
    {
      "topic": "crispr",
      "title": "ADA mechanism",
      "pages": "12",
      "text": "ADA deficiency disrupts immunity because accumulated deoxyadenosine damages T lymphocytes."
    },
    {
      "topic": "crispr",
      "title": "CFTR",
      "pages": "15",
      "text": "The cystic fibrosis example targets CFTR, whose dysfunction disrupts chloride transport and contributes to thick respiratory mucus."
    },
    {
      "topic": "crispr",
      "title": "Vector requirements",
      "pages": "18",
      "text": "An ideal vector combines efficient, specific delivery with low toxicity, low immune recognition, stability, and adequate expression duration."
    },
    {
      "topic": "crispr",
      "title": "Vector function",
      "pages": "18",
      "text": "Vectors must protect therapeutic DNA and deliver it across cellular barriers to the appropriate intracellular site, including the nucleus for DNA-based expression."
    },
    {
      "topic": "crispr",
      "title": "Retrovirus",
      "pages": "19",
      "text": "The lecture emphasizes stable host-genome integration by recombinant retroviral vectors and their use in dividing target cells."
    },
    {
      "topic": "crispr",
      "title": "Adenovirus",
      "pages": "20",
      "text": "Adenovirus is presented as a DNA viral vector suitable for non-dividing human cells."
    },
    {
      "topic": "crispr",
      "title": "Herpes vector",
      "pages": "21",
      "text": "Herpes simplex virus is highlighted for its natural tendency to infect and persist in nervous cells."
    },
    {
      "topic": "crispr",
      "title": "Nonviral classification",
      "pages": "17,22–24",
      "text": "Microinjection is a physical delivery method, and lipofection uses lipid vesicles; both are nonviral."
    },
    {
      "topic": "crispr",
      "title": "Pure DNA",
      "pages": "22",
      "text": "Direct pure-DNA delivery has relatively low uptake and expression efficiency, so large or repeated doses may be needed."
    },
    {
      "topic": "crispr",
      "title": "Lipoplexes",
      "pages": "22,24",
      "text": "Lipoplexes are lipid–DNA complexes; lipid-based delivery helps carry genetic material into cells, although lysosomal degradation can limit success."
    },
    {
      "topic": "crispr",
      "title": "Gene gun",
      "pages": "23",
      "text": "A gene gun uses a high-pressure system to propel DNA-coated gold or tungsten particles into tissue."
    },
    {
      "topic": "crispr",
      "title": "Microinjection",
      "pages": "23",
      "text": "Microinjection uses a glass micropipette and micromanipulator to introduce microscopic material into an individual living cell."
    },
    {
      "topic": "crispr",
      "title": "Gene augmentation",
      "pages": "25–26",
      "text": "The functional added copy supplies the product that was missing. The slides use augmentation terminology for this addition-based strategy."
    },
    {
      "topic": "crispr",
      "title": "Antigene inhibition",
      "pages": "25",
      "text": "The lecture distinguishes antigene inhibition of transcription from antisense inhibition of translation."
    },
    {
      "topic": "crispr",
      "title": "Antisense inhibition",
      "pages": "25",
      "text": "In the lecture's distinction, antisense oligonucleotides block translation from the target RNA."
    },
    {
      "topic": "crispr",
      "title": "Oncogene inhibition",
      "pages": "27",
      "text": "Gene inhibition can reduce expression or function of a disease-promoting oncogene and thereby limit further cancer-cell growth."
    },
    {
      "topic": "crispr",
      "title": "Suicide genes",
      "pages": "28–29,36",
      "text": "Suicide-gene strategies introduce genetic instructions that lead to death of the targeted diseased cells, directly or through prodrug activation."
    },
    {
      "topic": "crispr",
      "title": "Immune marking",
      "pages": "28–29",
      "text": "Introduced DNA can encode a marker that helps the body's immune system recognize and attack the diseased cell."
    },
    {
      "topic": "crispr",
      "title": "Expression duration",
      "pages": "31",
      "text": "The lecture highlights short-lived benefit when transferred genetic material is not maintained as cells divide; durability depends on the delivery system and target cells."
    },
    {
      "topic": "crispr",
      "title": "Vector adverse effects",
      "pages": "31",
      "text": "Viral vectors can provoke toxicity, immune responses, and inflammation, which can limit gene-therapy success."
    },
    {
      "topic": "crispr",
      "title": "BMPs",
      "pages": "33",
      "text": "Bone morphogenetic proteins, especially BMP2, BMP4, and BMP7 in the lecture, can induce new bone formation and support repair strategies."
    },
    {
      "topic": "crispr",
      "title": "PDGF",
      "pages": "34",
      "text": "PDGF gene delivery is linked in the lecture to gingival fibroblast stimulation and favorable bone-regeneration effects around teeth and implants."
    },
    {
      "topic": "crispr",
      "title": "Bone sialoprotein",
      "pages": "34",
      "text": "Bone sialoprotein is described as a major noncollagenous protein in bone and other mineralized tissues."
    },
    {
      "topic": "crispr",
      "title": "DNA vaccination",
      "pages": "35",
      "text": "DNA vaccination supplies an antigen-encoding sequence so host cells make the antigen and stimulate an immune response."
    },
    {
      "topic": "crispr",
      "title": "Salivary immunity",
      "pages": "35",
      "text": "The animal-model example describes local fimbrial protein expression followed by specific salivary IgA and IgG and serum IgG."
    },
    {
      "topic": "crispr",
      "title": "Tooth-development genes",
      "pages": "37",
      "text": "PAX9 is identified as a master gene critical for tooth development. RUNX2 and USAG-1 are also discussed as research targets affecting tooth formation."
    },
    {
      "topic": "crispr",
      "title": "Editing technologies",
      "pages": "38",
      "text": "The lecture compares CRISPR-Cas systems with transcription activator-like effector nucleases and zinc-finger nucleases."
    },
    {
      "topic": "crispr",
      "title": "Cas9 function",
      "pages": "40–41,47",
      "text": "Cas9 is an RNA-guided DNA endonuclease that cuts DNA; guide RNA provides the targeting information."
    },
    {
      "topic": "crispr",
      "title": "Guide RNA components",
      "pages": "40",
      "text": "The lecture describes gRNA as combining crRNA with tracrRNA. crRNA carries sequence specificity, while tracrRNA supports maturation and complex formation."
    },
    {
      "topic": "crispr",
      "title": "crRNA specificity",
      "pages": "40,48",
      "text": "Guide–target base complementarity directs the complex to the intended DNA sequence."
    },
    {
      "topic": "crispr",
      "title": "tracrRNA",
      "pages": "40,43",
      "text": "tracrRNA is the trans-activating RNA described as helping crRNA maturation and formation of the functional guide complex."
    },
    {
      "topic": "crispr",
      "title": "PAM",
      "pages": "42",
      "text": "PAM means protospacer adjacent motif. An appropriate adjacent DNA motif is a required targeting feature for the selected Cas nuclease."
    },
    {
      "topic": "crispr",
      "title": "Repair after cutting",
      "pages": "43,48",
      "text": "The cell recognizes the cut as DNA damage and repairs it; the repair outcome produces the resulting sequence change."
    },
    {
      "topic": "crispr",
      "title": "Retargeting",
      "pages": "49",
      "text": "Changing the roughly 20–21-nucleotide targeting region of the guide changes sequence specificity while Cas9 can remain the same."
    },
    {
      "topic": "crispr",
      "title": "Multiplexing",
      "pages": "49",
      "text": "Supplying Cas9 with more than one guide RNA allows simultaneous targeting of multiple sites."
    },
    {
      "topic": "crispr",
      "title": "Knockout workflow",
      "pages": "50",
      "text": "The diagram shows zygote injection of Cas9 mRNA and gRNA, followed by development, embryo transfer, and screening."
    },
    {
      "topic": "crispr",
      "title": "PCR assessment",
      "pages": "51",
      "text": "PCR primers should amplify a region surrounding the target, with the target site within the amplicon for assessment."
    },
    {
      "topic": "crispr",
      "title": "Mismatch assays",
      "pages": "51",
      "text": "CEL I and T7 endonuclease I assays detect DNA mismatches in PCR products and can help assess mutagenesis."
    },
    {
      "topic": "crispr",
      "title": "Sequencing",
      "pages": "51",
      "text": "DNA sequencing identifies the actual nucleotide changes, beyond indicating that mismatches are present."
    },
    {
      "topic": "crispr",

function balancedSample(pool,count){const groups=shuffle([...new Set(pool.map(q=>q.topic+'|'+q.level))]).map(k=>shuffle(pool.filter(q=>q.topic+'|'+q.level===k)));const chosen=[],used=new Set();for(let pass=0;pass<2&&chosen.length<count;pass++){let changed=true;while(changed&&chosen.length<count){changed=false;for(const g of groups){const idx=g.findIndex(q=>pass===1||!used.has(q.topic+'|'+q.concept));if(idx>=0&&chosen.length<count){const [q]=g.splice(idx,1);chosen.push(q);used.add(q.topic+'|'+q.concept);changed=true;}}}}return shuffle(chosen);}
function mockSample(){const topics=shuffle(DATA.topics.map(t=>t.id)),allocation=[[8,8],[8,9],[9,8]],out=[];topics.forEach((t,i)=>{const concepts=shuffle([...new Set(DATA.questions.filter(q=>q.topic===t).map(q=>q.concept))]);allocation[i].forEach((count,j)=>{for(let k=0;k<count;k++){const c=concepts.shift();out.push(shuffle(DATA.questions.filter(q=>q.topic===t&&q.concept===c&&q.level===(j?'application':'recall')))[0]);}});});return shuffle(out);}
function renderExam(){$('#main').innerHTML=pageHeader('Test day rehearsal','50 questions. 60 minutes.','A fresh mixed exam with 25 recall and 25 application questions. Explanations are revealed after submission.')+resumeNotice()+`<div class="stats"><div class="stat"><strong>50</strong><span>unique questions</span></div><div class="stat"><strong>60:00</strong><span>countdown timer</span></div><div class="stat"><strong>25 / 25</strong><span>recall / application</span></div></div><section class="panel"><h2>What to expect</h2><p>The three topics receive 16, 17, and 17 questions, with the smaller allocation rotating randomly. Each exam uses distinct concepts, so a recall question won’t give away its paired application question.</p><ul><li>Move freely between questions and change your answers.</li><li>Bookmark questions to return to them.</li><li>The countdown continues when you leave the page or close the tab.</li><li>The exam submits when time expires. Unanswered questions count as incorrect.</li></ul><button class="primary" id="startmock">Begin 60-minute mock exam →</button></section>`;$('#startmock').onclick=()=>start(mockSample(),'exam',50,true);bindResume();}
function start(pool,mode,count,timed=false){if(!pool.length)return;if(state.session&&!state.session.finished&&!confirm('Replace the unfinished session? Your checked answers and completed history will be kept.'))return;const chosen=timed?pool:balancedSample(pool,count);state.session={mode,timed,hardTopic:chosen.every(q=>q.difficulty==='hard')&&new Set(chosen.map(q=>q.topic)).size===1?chosen[0].topic:null,deadline:timed?Date.now()+3600000:null,started:Date.now(),elapsed:0,tick:mode==='practice'?Date.now():null,index:0,finished:false,items:chosen.map(q=>({id:q.id,order:shuffle([0,1,2,3]),selected:null,checked:false}))};save();view='quiz';render();window.scrollTo(0,0);}

function renderQuiz(){document.body.classList.add('quiz-active');const s=state.session;if(!validSession(s)){navigate('practice');return;}if(s.finished){view='results';render();return;}if(s.mode==='practice'&&!s.tick)s.tick=Date.now();const item=s.items[s.index],q=byId[item.id],reveal=s.mode==='practice'&&item.checked;$('#main').innerHTML=`<div class="topline"><span>${s.timed?'Timed mock exam':s.mode==='exam'?'Exam session':'Study session'}</span><span>Question ${s.index+1} / ${s.items.length}</span></div><div class="row spread"><span class="pill">${esc(topicById[q.topic].title)}${q.difficulty==='hard'?' · Hard Mode':''}</span><span>${s.timed?'Remaining':'Elapsed'} <span class="clock ${s.timed&&clockValue()<=300?'urgent':''}" id="clock">${timeText(clockValue())}</span></span></div><div class="bar"><span style="width:${(s.index+1)/s.items.length*100}%"></span></div><section class="panel"><div class="row spread"><span class="hint">${q.level==='recall'?'First order · recall':'Second order · application'}</span><button class="bookmark ${state.bookmarks.includes(q.id)?'bookmark-on':''}" id="bookmark" aria-pressed="${state.bookmarks.includes(q.id)}">${state.bookmarks.includes(q.id)?'★ Bookmarked':'☆ Bookmark'}</button></div><h1 class="stem" id="qstem">${esc(q.stem)}</h1><div class="choices" role="group" aria-labelledby="qstem">${item.order.map((o,j)=>`<button class="choice ${item.selected===o?'selected':''} ${reveal&&o===q.answer?'correct':''} ${reveal&&item.selected===o&&o!==q.answer?'incorrect':''}" data-option="${o}" aria-pressed="${item.selected===o}" ${reveal?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${esc(q.options[o])}</span>${reveal&&o===q.answer?'<span class="flag">Correct</span>':reveal&&item.selected===o?'<span class="flag">Your answer</span>':''}</button>`).join('')}</div>${reveal?`<div class="feedback" role="status"><strong class="${item.selected===q.answer?'good':'bad'}">${item.selected===q.answer?'Correct.':'Not quite.'}</strong><p>${esc(q.explanation)}</p><div class="source">${esc(source(q))}</div></div>`:''}<div class="footerbuttons quiz-actions" aria-label="Question controls"><div class="action-left"><button id="prev" ${s.index===0?'disabled':''}>← Previous</button>${s.mode==='practice'&&!item.checked?'<button id="skip" class="textbutton">Skip</button>':''}</div><div class="action-primary">${s.mode==='practice'&&!item.checked?`<button class="primary" id="check" ${item.selected===null?'disabled':''}>Check answer</button>`:`<button class="primary" id="next">${s.index===s.items.length-1?'Finish session':'Next →'}</button>`}</div></div></section><section class="panel"><div class="row spread"><span class="hint">${s.items.filter(i=>i.selected!==null).length} answered · ${s.items.filter(i=>i.selected===null).length} unanswered</span><button class="textbutton" id="leave">Save & leave</button></div><div class="qnav" aria-label="Question navigation">${s.items.map((i,n)=>`<button data-jump="${n}" class="${i.selected!==null?'answered':''} ${s.index===n?'current':''} ${state.bookmarks.includes(i.id)?'bookmarked':''}" ${n===s.index?'aria-current="step"':''} aria-label="Question ${n+1}${i.selected!==null?', answered':', unanswered'}${state.bookmarks.includes(i.id)?', bookmarked':''}">${n+1}</button>`).join('')}</div><div class="row spread"><span class="hint">Green: answered · gold underline: bookmarked</span><button class="secondary" id="submit">${s.mode==='exam'?'Submit exam':'Finish session'}</button></div></section><p class="hint"><kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> or <kbd>1</kbd>–<kbd>4</kbd> choose · <kbd>Enter</kbd> check / advance · <kbd>B</kbd> bookmark</p>`;

function finish(expired=false){const s=state.session;if(!s||s.finished)return;const unanswered=s.items.filter(i=>i.selected===null).length;if(!expired&&unanswered&&!confirm(`${unanswered} unanswered question${unanswered===1?'':'s'} will count as incorrect. Submit this session?`))return;const seconds=s.timed?Math.min(3600,Math.floor((Date.now()-s.started)/1000)):s.mode==='exam'?Math.floor((Date.now()-s.started)/1000):elapsed();s.elapsed=seconds;s.tick=null;s.finished=true;s.expired=expired;s.items.forEach(i=>{if(!i.checked){record(i);i.checked=true;}});state.history.unshift({date:Date.now(),mode:s.mode,timed:s.timed,hardTopic:s.hardTopic||null,score:s.items.filter(i=>i.selected===byId[i.id].answer).length,total:s.items.length,seconds});state.history=state.history.slice(0,40);save();view='results';render();window.scrollTo(0,0);}

|'<div class="empty">No missed answers.</div>';bindMarks();};bindMarks();}

function renderScope(){$('#main').innerHTML=pageHeader('Exam II · October 27, 2026','What’s in your exam bank.','Built from the three supplied Hakan Ozdener lecture PDFs and the instructor’s Exam II topic message.')+`<section class="panel"><h2>Included material</h2><p>Normal Mode retains its 400 questions. Hard Mode adds separate revised versions of all 150 Topic 2 and all 150 Topic 3 questions. Hard timed exams use 50 questions in 60 minutes from the selected topic, with 25 recall and 25 application questions.</p><div class="tablewrap"><table><thead><tr><th>Topic</th><th>Source range</th><th>Bank</th></tr></thead><tbody>${DATA.topics.map(t=>`<tr><td><strong>${esc(t.title)}</strong><br><span class="hint">${esc(t.file)}</span></td><td>${t.id==='drug'?'PDF pages 1–35':'Full deck · '+t.pages+' pages'}</td><td>${topicCount(t.id)} questions<br><span class="hint">${topicCount(t.id)/2} recall / ${topicCount(t.id)/2} application</span></td></tr>`).join('')}</tbody></table></div></section><div class="notice"><strong>Biobanking is excluded.</strong> The drug PDF’s biobanking section begins at page 36. Banking and storage content in the stem-cell deck is also excluded. Tissue engineering and regenerative dentistry are included in the stem-cell topic.</div><section class="panel"><h2>How to read the references</h2><p>The 100 additional questions extend concepts in the original bank. Their page references are inherited from that bank; the original PDFs were not independently rechecked for this expansion.</p><p>References identify the source deck and its original PDF page number. They are shown with answer explanations so the source label does not give away a question during an exam.</p><p>Original lecture PDFs are not republished here. Open your own PDF at the cited page when you want the full diagram or slide context.</p></section><section class="panel"><h2>Slide ambiguities handled in this bank</h2><ul><li>The gene-therapy slides use “augmentation” in more than one way. Questions specify whether a functional gene is added or a sequence is corrected.</li><li>The cystic-fibrosis text and illustration use different vector labels. Questions test CFTR and the delivery concept rather than that conflicting label.</li><li>The stem-cell source list mislabels periodontal ligament cells as SHED. Here, SHED consistently means cells from human exfoliated deciduous teeth.</li><li>Drug slides give differing trial enrollment ranges. Questions test a phase’s purpose and population rather than conflicting exact counts.</li><li>Historical cost estimates, predictions, and broad legal claims are not used as current facts in scored questions.</li><li>Research examples, including whole-tooth regeneration in mice, are presented as research examples rather than guaranteed clinical outcomes.</li><li>The cancer-stem-cell explanation follows the lecture model of treatment-resistant tumor-initiating cells; it does not assume every stem cell always resists chemotherapy.</li></ul></section>`;}

const hardSettings={stem:{count:20,level:'both'},drug:{count:20,level:'both'}};
function hardProgress(){return `<section class="panel"><h2>Hard Mode · separate progress</h2>${['stem','drug'].map(t=>{const pool=DATA.hardQuestions.filter(q=>q.topic===t),done=pool.filter(q=>state.record[q.id]),correct=done.filter(q=>state.record[q.id].correct);return `<div style="margin:18px 0"><strong>${esc(topicById[t].title)}</strong><p class="hint">${done.length}/${pool.length} checked · ${correct.length}/${done.length} latest answers correct</p><div class="bar"><span style="width:${done.length/pool.length*100}%"></span></div></div>`;}).join('')}</section>`;}
function hardMockSample(t){const concepts=shuffle([...new Set(DATA.hardQuestions.filter(q=>q.topic===t).map(q=>q.concept))]);return shuffle(concepts.slice(0,50).map((c,i)=>shuffle(DATA.hardQuestions.filter(q=>q.topic===t&&q.concept===c&&q.level===(i<25?'recall':'application')))[0]));}
function renderHard(t){const settings=hardSettings[t],all=DATA.hardQuestions.filter(q=>q.topic===t),pool=all.filter(q=>settings.level==='both'||q.level===settings.level),done=all.filter(q=>state.record[q.id]).length;
$('#main').innerHTML=pageHeader('Topic '+(t==='stem'?'2':'3')+' · Hard Mode',topicById[t].title,'Closer answer choices, clearer wording, and explanations of important distinctions. Normal questions stay unchanged.')+resumeNotice()+`<div class="stats"><div class="stat"><strong>150</strong><span>revised questions</span></div><div class="stat"><strong>75 / 75</strong><span>recall / application</span></div><div class="stat"><strong>${done}/150</strong><span>Hard Mode questions checked</span></div></div><section class="panel"><h2>Practice</h2><div class="fields"><label class="field">Question type<select id="hardlevel"><option value="both">Recall + application</option><option value="recall">Recall</option><option value="application">Application</option></select></label><label class="field">Session length<select id="hardcount">${[10,20,40,50,100,150].map(n=>`<option value="${n}" ${n===settings.count?'selected':''}>${n===150?'All available':n+' questions'}</option>`).join('')}</select></label></div><p class="hint">${pool.length} available · check each answer at your own pace.</p><button class="primary" id="hardpractice">Start practice · ${Math.min(settings.count,pool.length)} questions</button></section><section class="panel"><h2>Timed exam</h2><p><strong>50 questions · 60 minutes</strong><br>25 recall + 25 application, from this topic's Hard Mode bank. Answers and explanations appear after submission.</p><p class="hint">Uses the full topic regardless of the practice filters above. The timer continues if you leave the page.</p><button class="primary" id="hardtimed">Start timed exam →</button></section><p class="hint">${t==='drug'?'Drug discovery only. Biobanking is excluded.':'Stem cells, tissue engineering, and regenerative dentistry. Biobanking is excluded.'}</p>`;
$('#hardlevel').value=settings.level;$('#hardlevel').onchange=e=>{settings.level=e.target.value;renderHard(t);};$('#hardcount').onchange=e=>{settings.count=+e.target.value;renderHard(t);};$('#hardpractice').onclick=()=>start(pool,'practice',Math.min(settings.count,pool.length));$('#hardtimed').onclick=()=>start(hardMockSample(t),'exam',50,true);bindResume();}

save();render();

</script></body></html>
