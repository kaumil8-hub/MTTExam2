    },

      "topic": "crispr",
      "title": "Gene correction",
      "pages": "5",
      "text": "Gene correction repairs the abnormal sequence; adding a separate functional copy is a different strategy."

      "topic": "crispr",
      "title": "Somatic therapy",
      "pages": "8–9",
      "text": "Somatic therapy targets body cells such as skin, blood, or bone marrow cells and is not intended to transmit the change to offspring."
    },
    {
      "topic": "crispr",
      "title": "Germline therapy",
      "pages": "8–9,52",
      "text": "Germline changes can pass to descendants, which creates ethical implications extending beyond the treated individual."
    },
    {
      "topic": "crispr",
      "title": "Ex vivo sequence",
      "pages": "10–11",
      "text": "Ex vivo therapy removes cells, modifies them outside the body, selects or expands corrected cells, and returns them to the patient."
    },
    {
      "topic": "crispr",
      "title": "Delivery selection",
      "pages": "11,13",
      "text": "In vivo delivery is useful when target cells cannot be cultured sufficiently or cannot be effectively reimplanted."
    },
    {
      "topic": "crispr",
      "title": "ADA-SCID",
      "pages": "12",
      "text": "The lecture's SCID example involves adenosine deaminase (ADA) deficiency and toxic deoxyadenosine accumulation that damages T lymphocytes."
    },
    {
      "topic": "crispr",
      "title": "ADA mechanism",
      "pages": "12",
      "text": "ADA deficiency disrupts immunity because accumulated deoxyadenosine damages T lymphocytes."
    },
    {
      "topic": "crispr",
      "title": "CFTR",
      "pages": "15",
      "text": "The cystic fibrosis example targets CFTR, whose dysfunction disrupts chloride transport and contributes to thick respiratory mucus."
    },
    {
      "topic": "crispr",
      "title": "Vector requirements",
      "pages": "18",
      "text": "An ideal vector combines efficient, specific delivery with low toxicity, low immune recognition, stability, and adequate expression duration."
    },
    {
      "topic": "crispr",
      "title": "Vector function",
      "pages": "18",
      "text": "Vectors must protect therapeutic DNA and deliver it across cellular barriers to the appropriate intracellular site, including the nucleus for DNA-based expression."
    },
    {
      "topic": "crispr",
      "title": "Retrovirus",
      "pages": "19",
      "text": "The lecture emphasizes stable host-genome integration by recombinant retroviral vectors and their use in dividing target cells."
    },
    {
      "topic": "crispr",
      "title": "Adenovirus",
      "pages": "20",
      "text": "Adenovirus is presented as a DNA viral vector suitable for non-dividing human cells."
    },
    {
      "topic": "crispr",
      "title": "Herpes vector",
      "pages": "21",
      "text": "Herpes simplex virus is highlighted for its natural tendency to infect and persist in nervous cells."
    },
    {
      "topic": "crispr",
      "title": "Nonviral classification",
      "pages": "17,22–24",
      "text": "Microinjection is a physical delivery method, and lipofection uses lipid vesicles; both are nonviral."
    },
    {
      "topic": "crispr",
      "title": "Pure DNA",
      "pages": "22",
      "text": "Direct pure-DNA delivery has relatively low uptake and expression efficiency, so large or repeated doses may be needed."
    },
    {
      "topic": "crispr",
      "title": "Lipoplexes",
      "pages": "22,24",
      "text": "Lipoplexes are lipid–DNA complexes; lipid-based delivery helps carry genetic material into cells, although lysosomal degradation can limit success."
    },
    {
      "topic": "crispr",
      "title": "Gene gun",
      "pages": "23",
      "text": "A gene gun uses a high-pressure system to propel DNA-coated gold or tungsten particles into tissue."
    },
    {
      "topic": "crispr",
      "title": "Microinjection",
      "pages": "23",
      "text": "Microinjection uses a glass micropipette and micromanipulator to introduce microscopic material into an individual living cell."
    },
    {
      "topic": "crispr",
      "title": "Gene augmentation",

      "text": "The lecture compares CRISPR-Cas systems with transcription activator-like effector nucleases and zinc-finger nucleases."

      "text": "The lecture describes gRNA as combining crRNA with tracrRNA. crRNA carries sequence specificity, while tracrRNA supports maturation and complex formation."

      "title": "tracrRNA",

      "title": "Repair after cutting",

    },
    {

      "topic": "crispr",
      "title": "PCR assessment",
      "pages": "51",
      "text": "PCR primers should amplify a region surrounding the target, with the target site within the amplicon for assessment."

    {

      "title": "Mismatch assays",
      "pages": "51",
      "text": "CEL I and T7 endonuclease I assays detect DNA mismatches in PCR products and can help assess mutagenesis."
    },
    {
      "topic": "crispr",
      "title": "Sequencing",

      "text": "DNA sequencing identifies the actual nucleotide changes, beyond indicating that mismatches are present."

      "topic": "crispr",
      "title": "Off-target effects",
      "pages": "53,55",
      "text": "Off-target effects are unintended edits elsewhere in the genome, often at sites similar to the intended target. High on-target efficiency does not exclude them."

      "title": "Disease modeling",
      "pages": "54",
      "text": "Editing followed by matched differentiation and phenotypic comparison helps connect a mutation to a disease-related cellular phenotype."

      "title": "Multipotency",

    {

function balancedSample(pool,count){const groups=shuffle([...new Set(pool.map(q=>q.topic+'|'+q.level))]).map(k=>shuffle(pool.filter(q=>q.topic+'|'+q.level===k)));const chosen=[],used=new Set();for(let pass=0;pass<2&&chosen.length<count;pass++){let changed=true;while(changed&&chosen.length<count){changed=false;for(const g of groups){const idx=g.findIndex(q=>pass===1||!used.has(q.topic+'|'+q.concept));if(idx>=0&&chosen.length<count){const [q]=g.splice(idx,1);chosen.push(q);used.add(q.topic+'|'+q.concept);changed=true;}}}}return shuffle(chosen);}
function mockSample(){const topics=shuffle(DATA.topics.map(t=>t.id)),allocation=[[8,8],[8,9],[9,8]],out=[];topics.forEach((t,i)=>{const concepts=shuffle([...new Set(DATA.questions.filter(q=>q.topic===t).map(q=>q.concept))]);allocation[i].forEach((count,j)=>{for(let k=0;k<count;k++){const c=concepts.shift();out.push(DATA.questions.find(q=>q.topic===t&&q.concept===c&&q.level===(j?'application':'recall')));}});});return shuffle(out);}
function renderExam(){$('#main').innerHTML=pageHeader('Test day rehearsal','50 questions. 60 minutes.','A fresh mixed exam with 25 recall and 25 application questions. Explanations are revealed after submission.')+resumeNotice()+`<div class="stats"><div class="stat"><strong>50</strong><span>unique questions</span></div><div class="stat"><strong>60:00</strong><span>countdown timer</span></div><div class="stat"><strong>25 / 25</strong><span>recall / application</span></div></div><section class="panel"><h2>What to expect</h2><p>The three topics receive 16, 17, and 17 questions, with the smaller allocation rotating randomly. Each exam uses distinct concepts, so a recall question won’t give away its paired application question.</p><ul><li>Move freely between questions and change your answers.</li><li>Bookmark questions to return to them.</li><li>The countdown continues when you leave the page or close the tab.</li><li>The exam submits when time expires. Unanswered questions count as incorrect.</li></ul><button class="primary" id="startmock">Begin 60-minute mock exam →</button></section>`;$('#startmock').onclick=()=>start(mockSample(),'exam',50,true);bindResume();}
function start(pool,mode,count,timed=false){if(!pool.length)return;if(state.session&&!state.session.finished&&!confirm('Replace the unfinished session? Your checked answers and completed history will be kept.'))return;const chosen=timed?pool:balancedSample(pool,count);state.session={mode,timed,deadline:timed?Date.now()+3600000:null,started:Date.now(),elapsed:0,tick:mode==='practice'?Date.now():null,index:0,finished:false,items:chosen.map(q=>({id:q.id,order:shuffle([0,1,2,3]),selected:null,checked:false}))};save();view='quiz';render();window.scrollTo(0,0);}
function clockValue(){const s=state.session;return s?.timed?Math.max(0,Math.ceil((s.deadline-Date.now())/1000)):s?.mode==='exam'?Math.floor((Date.now()-s.started)/1000):elapsed();}
function renderQuiz(){const s=state.session;if(!validSession(s)){navigate('practice');return;}if(s.finished){view='results';render();return;}if(s.mode==='practice'&&!s.tick)s.tick=Date.now();const item=s.items[s.index],q=byId[item.id],reveal=s.mode==='practice'&&item.checked;$('#main').innerHTML=`<div class="topline"><span>${s.timed?'Timed mock exam':s.mode==='exam'?'Exam session':'Study session'}</span><span>Question ${s.index+1} / ${s.items.length}</span></div><div class="row spread"><span class="pill">${esc(topicById[q.topic].title)}</span><span>${s.timed?'Remaining':'Elapsed'} <span class="clock ${s.timed&&clockValue()<=300?'urgent':''}" id="clock">${timeText(clockValue())}</span></span></div><div class="bar"><span style="width:${(s.index+1)/s.items.length*100}%"></span></div><section class="panel"><div class="row spread"><span class="hint">${q.level==='recall'?'First order · recall':'Second order · application'}</span><button class="bookmark ${state.bookmarks.includes(q.id)?'bookmark-on':''}" id="bookmark" aria-pressed="${state.bookmarks.includes(q.id)}">${state.bookmarks.includes(q.id)?'★ Bookmarked':'☆ Bookmark'}</button></div><h1 class="stem" id="qstem">${esc(q.stem)}</h1><div class="choices" role="group" aria-labelledby="qstem">${item.order.map((o,j)=>`<button class="choice ${item.selected===o?'selected':''} ${reveal&&o===q.answer?'correct':''} ${reveal&&item.selected===o&&o!==q.answer?'incorrect':''}" data-option="${o}" aria-pressed="${item.selected===o}" ${reveal?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${esc(q.options[o])}</span>${reveal&&o===q.answer?'<span class="flag">Correct</span>':reveal&&item.selected===o?'<span class="flag">Your answer</span>':''}</button>`).join('')}</div>${reveal?`<div class="feedback" role="status"><strong class="${item.selected===q.answer?'good':'bad'}">${item.selected===q.answer?'Correct.':'Not quite.'}</strong><p>${esc(q.explanation)}</p><div class="source">${esc(source(q))}</div></div>`:''}<div class="row spread footerbuttons"><button id="prev" ${s.index===0?'disabled':''}>← Previous</button><div class="row">${s.mode==='practice'&&!item.checked?`<button class="primary" id="check" ${item.selected===null?'disabled':''}>Check answer</button>`:''}<button class="${s.mode==='exam'||reveal?'primary':'secondary'}" id="next">${s.index===s.items.length-1?'Finish session':'Next →'}</button></div></div></section><section class="panel"><div class="row spread"><span class="hint">${s.items.filter(i=>i.selected!==null).length} answered · ${s.items.filter(i=>i.selected===null).length} unanswered</span><button class="textbutton" id="leave">Save & leave</button></div><div class="qnav" aria-label="Question navigation">${s.items.map((i,n)=>`<button data-jump="${n}" class="${i.selected!==null?'answered':''} ${s.index===n?'current':''} ${state.bookmarks.includes(i.id)?'bookmarked':''}" ${n===s.index?'aria-current="step"':''} aria-label="Question ${n+1}${i.selected!==null?', answered':', unanswered'}${state.bookmarks.includes(i.id)?', bookmarked':''}">${n+1}</button>`).join('')}</div><div class="row spread"><span class="hint">Green: answered · gold underline: bookmarked</span><button class="secondary" id="submit">${s.mode==='exam'?'Submit exam':'Finish session'}</button></div></section><p class="hint"><kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> or <kbd>1</kbd>–<kbd>4</kbd> choose · <kbd>Enter</kbd> check / advance · <kbd>B</kbd> bookmark</p>`;
document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>select(+b.dataset.option));$('#bookmark').onclick=()=>toggleBookmark(q.id);$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>s.index===s.items.length-1?finish():move(1);if($('#check'))$('#check').onclick=check;$('#leave').onclick=()=>navigate(s.timed?'exam':'practice');$('#submit').onclick=()=>finish();document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{s.index=+b.dataset.jump;save();renderQuiz();});}
function select(o){const s=state.session,i=s.items[s.index];if(s.finished||(s.mode==='practice'&&i.checked))return;if(s.timed&&Date.now()>=s.deadline){finish(true);return;}i.selected=o;save();renderQuiz();}
function record(i){const q=byId[i.id],old=state.record[i.id];state.record[i.id]={correct:i.selected===q.answer,attempts:(Number(old?.attempts)||0)+1,last:Date.now()};}
function check(){const s=state.session,i=s.items[s.index];if(i.selected===null||i.checked)return;i.checked=true;record(i);save();updateSidebar();renderQuiz();}
function move(d){const s=state.session;s.index=Math.max(0,Math.min(s.items.length-1,s.index+d));save();renderQuiz();window.scrollTo(0,0);}
function toggleBookmark(id){state.bookmarks=state.bookmarks.includes(id)?state.bookmarks.filter(x=>x!==id):[...state.bookmarks,id];save();updateSidebar();if(view==='quiz')renderQuiz();else render();}
function finish(expired=false){const s=state.session;if(!s||s.finished)return;const unanswered=s.items.filter(i=>i.selected===null).length;if(!expired&&unanswered&&!confirm(`${unanswered} unanswered question${unanswered===1?'':'s'} will count as incorrect. Submit this session?`))return;const seconds=s.timed?Math.min(3600,Math.floor((Date.now()-s.started)/1000)):s.mode==='exam'?Math.floor((Date.now()-s.started)/1000):elapsed();s.elapsed=seconds;s.tick=null;s.finished=true;s.expired=expired;s.items.forEach(i=>{if(!i.checked){record(i);i.checked=true;}});state.history.unshift({date:Date.now(),mode:s.mode,timed:s.timed,score:s.items.filter(i=>i.selected===byId[i.id].answer).length,total:s.items.length,seconds});state.history=state.history.slice(0,40);save();view='results';render();window.scrollTo(0,0);}
function reviewCard(i){const q=byId[i.id],ok=i.selected===q.answer;return `<article class="reviewcard"><div class="row spread"><span class="pill">${esc(topicById[q.topic].title)} · ${q.level}</span><button class="textbutton" data-mark="${q.id}" aria-pressed="${state.bookmarks.includes(q.id)}">${state.bookmarks.includes(q.id)?'★ Saved':'☆ Save'}</button></div><h3>${esc(q.stem)}</h3><p class="${ok?'good':'bad'}">${ok?'Correct':i.selected===null?'Unanswered':'Incorrect'}</p><ol class="review-options" type="A">${i.order.map(o=>`<li class="${o===q.answer?'is-correct':i.selected===o?'is-wrong':''}">${esc(q.options[o])}${o===q.answer?' — correct':i.selected===o?' — your answer':''}</li>`).join('')}</ol><p>${esc(q.explanation)}</p><p class="source">${esc(source(q))}</p></article>`;}
function bindMarks(){document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>toggleBookmark(b.dataset.mark));}
function renderResults(){const s=state.session;if(!s?.finished){navigate('home');return;}const wrong=s.items.filter(i=>i.selected!==byId[i.id].answer),score=s.items.length-wrong.length;$('#main').innerHTML=pageHeader('Session complete','See what needs another look.',s.expired?'Time expired. Your saved answers were submitted automatically.':'Review the explanations, then return to the concepts you missed.')+`<section class="panel"><div class="score">${Math.round(score/s.items.length*100)}%</div><p>${score} / ${s.items.length} correct · ${timeText(s.elapsed)} elapsed</p><div class="row"><button class="primary" id="newsession">New session</button>${wrong.length?'<button class="secondary" id="retry">Practice these mistakes</button>':''}</div></section><div class="panel tablewrap"><table><thead><tr><th>Breakdown</th><th>Correct / total</th></tr></thead><tbody>${[...DATA.topics.map(t=>[t.title,q=>q.topic===t.id]),['Recall',q=>q.level==='recall'],['Application',q=>q.level==='application']].map(([label,test])=>{const a=s.items.filter(i=>test(byId[i.id]));return `<tr><td>${esc(label)}</td><td>${a.filter(i=>i.selected===byId[i.id].answer).length} / ${a.length}</td></tr>`;}).join('')}</tbody></table></div><div class="row spread" style="margin-bottom:18px"><h2 style="margin:0">Answer review</h2><label class="field">Show<select id="reviewfilter"><option value="missed">Missed only (${wrong.length})</option><option value="all">All questions (${s.items.length})</option></select></label></div><div id="reviews">${wrong.map(reviewCard).join('')||'<div class="empty">No missed answers. Choose “All questions” to review the explanations.</div>'}</div>`;$('#newsession').onclick=()=>navigate('practice');if($('#retry'))$('#retry').onclick=()=>start(wrong.map(i=>byId[i.id]),'practice',wrong.length);$('#reviewfilter').onchange=e=>{$('#reviews').innerHTML=(e.target.value==='all'?s.items:wrong).map(reviewCard).join('')||'<div class="empty">No missed answers.</div>';bindMarks();};bindMarks();}
function topicOptions(value){return `<option value="all">All topics</option>`+DATA.topics.map(t=>`<option value="${t.id}" ${value===t.id?'selected':''}>${esc(t.title)}</option>`).join('');}
function renderNotes(){const notes=DATA.notes.filter(n=>(notesTopic==='all'||n.topic===notesTopic)&&(!notesSearch||(n.title+' '+n.text).toLowerCase().includes(notesSearch.toLowerCase())));$('#main').innerHTML=pageHeader('Review the concepts','Short notes. Clear distinctions.','Search 150 concept notes, then use practice to test what you can retrieve without looking.')+`<div class="fields"><label class="field">Topic<select id="notestopic">${topicOptions(notesTopic)}</select></label><label class="field">Find a concept<input type="search" id="notessearch" placeholder="Try Cas9, SCAP, Phase II…" value="${esc(notesSearch)}"></label></div><p class="hint">${notes.length} concepts · references use original PDF page numbers</p><div id="noteslist">${notes.map(n=>`<details><summary>${esc(n.title)}<small>${esc(source(n))}</small></summary><div class="detailsbody"><p>${esc(n.text)}</p><button class="textbutton" data-practice-topic="${n.topic}">Practice this topic →</button></div></details>`).join('')||'<div class="empty">No matching concepts. Try another search.</div>'}</div>`;$('#notestopic').onchange=e=>{notesTopic=e.target.value;renderNotes();};$('#notessearch').oninput=e=>{const pos=e.target.selectionStart;notesSearch=e.target.value;renderNotes();const inp=$('#notessearch');inp.focus();if(pos!==null)inp.setSelectionRange(pos,pos);};document.querySelectorAll('[data-practice-topic]').forEach(b=>b.onclick=()=>{config.topics=[b.dataset.practiceTopic];navigate('practice');});}
function renderList(kind){const all=kind==='missed'?missed():marked(),pool=all.filter(q=>listTopic==='all'||q.topic===listTopic);$('#main').innerHTML=pageHeader(kind==='missed'?'Close the gaps':'Keep it handy',kind==='missed'?'Your missed questions.':'Your bookmarks.',kind==='missed'?'Questions stay here until your latest checked answer is correct.':'Save questions during practice or answer review, then return to them in a focused session.')+`<div class="fields"><label class="field">Topic<select id="listtopic">${topicOptions(listTopic)}</select></label></div>${pool.length?`<div class="notice row spread"><span>${pool.length} questions in this selection</span><button class="primary" id="studylist">Practice this selection</button></div>${pool.map(q=>`<details><summary>${esc(q.stem)}<small>${esc(topicById[q.topic].title)} · ${q.level}</small></summary><div class="detailsbody"><p class="good"><strong>Correct answer:</strong> ${esc(q.options[q.answer])}</p><p>${esc(q.explanation)}</p><p class="source">${esc(source(q))}</p><button class="textbutton" data-mark="${q.id}">${state.bookmarks.includes(q.id)?'★ Remove bookmark':'☆ Bookmark'}</button></div></details>`).join('')}`:`<div class="empty"><h2>${kind==='missed'?'No missed questions here.':'No bookmarked questions here.'}</h2><p>${kind==='missed'?'Complete a session to identify what needs more practice.':'Use the bookmark button on any question to save it.'}</p><button class="primary" id="beginpractice">Choose a practice session</button></div>`}`;$('#listtopic').onchange=e=>{listTopic=e.target.value;renderList(kind);};if($('#studylist'))$('#studylist').onclick=()=>start(pool,'practice',pool.length);if($('#beginpractice'))$('#beginpractice').onclick=()=>navigate('practice');bindMarks();}
function renderProgress(){const reviewed=DATA.questions.filter(q=>state.record[q.id]),correct=reviewed.filter(q=>state.record[q.id].correct).length;$('#main').innerHTML=pageHeader('Your learning record','Progress you can build on.','Coverage and accuracy use the latest checked response to each question, across all sessions.')+`<div class="stats"><div class="stat"><strong>${reviewed.length}/300</strong><span>unique questions checked</span></div><div class="stat"><strong>${reviewed.length?Math.round(correct/reviewed.length*100)+'%':'—'}</strong><span>latest-answer accuracy</span></div><div class="stat"><strong>${missed().length}</strong><span>questions to revisit</span></div></div><section class="panel"><h2>Coverage by topic</h2>${DATA.topics.map(t=>{const done=reviewed.filter(q=>q.topic===t.id),good=done.filter(q=>state.record[q.id].correct).length;return `<div style="margin:20px 0"><div class="progressrow"><strong>${esc(t.title)}</strong><span class="hint">${done.length}/100 checked</span></div><div class="bar"><span style="width:${done.length}%"></span></div><span class="hint">${good}/${done.length} latest answers correct</span></div>`;}).join('')}</section><section class="panel"><h2>Recall versus application</h2><div class="tablewrap"><table><thead><tr><th>Type</th><th>Checked</th><th>Latest correct</th></tr></thead><tbody>${['recall','application'].map(l=>{const a=reviewed.filter(q=>q.level===l);return `<tr><td>${l==='recall'?'First-order recall':'Second-order application'}</td><td>${a.length}/150</td><td>${a.filter(q=>state.record[q.id].correct).length}/${a.length}</td></tr>`;}).join('')}</tbody></table></div></section><section class="panel"><h2>Completed sessions</h2>${state.history.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Session</th><th>Score</th><th>Time</th></tr></thead><tbody>${state.history.map(h=>`<tr><td>${new Date(h.date).toLocaleDateString()}</td><td>${h.timed?'Timed mock exam':h.mode==='exam'?'Exam':'Study'}</td><td>${h.score}/${h.total}</td><td>${timeText(h.seconds)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Your completed sessions will appear here.</p>'}</section><p class="hint">Saved on this browser and device. Clearing browser storage removes progress.</p><button class="textbutton" id="reset">Reset all study progress</button>`;$('#reset').onclick=()=>{if(confirm('Clear all answers, bookmarks, sessions, and history for this Exam II app?')){state={record:{},bookmarks:[],session:null,history:[]};save();renderProgress();updateSidebar();toast('Exam II study progress reset.');}};}
function renderScope(){$('#main').innerHTML=pageHeader('Exam II · October 27, 2026','What’s in your exam bank.','Built from the three supplied Hakan Ozdener lecture PDFs and the instructor’s Exam II topic message.')+`<section class="panel"><h2>Included material</h2><div class="tablewrap"><table><thead><tr><th>Topic</th><th>Source range</th><th>Bank</th></tr></thead><tbody>${DATA.topics.map(t=>`<tr><td><strong>${esc(t.title)}</strong><br><span class="hint">${esc(t.file)}</span></td><td>${t.id==='drug'?'PDF pages 1–35':'Full deck · '+t.pages+' pages'}</td><td>100 questions<br><span class="hint">50 recall / 50 application</span></td></tr>`).join('')}</tbody></table></div></section><div class="notice"><strong>Biobanking is excluded.</strong> The drug PDF’s biobanking section begins at page 36. Banking and storage content in the stem-cell deck is also excluded. Tissue engineering and regenerative dentistry are included in the stem-cell topic.</div><section class="panel"><h2>How to read the references</h2><p>References identify the source deck and its original PDF page number. They are shown with answer explanations so the source label does not give away a question during an exam.</p><p>Original lecture PDFs are not republished here. Open your own PDF at the cited page when you want the full diagram or slide context.</p></section><section class="panel"><h2>Slide ambiguities handled in this bank</h2><ul><li>The gene-therapy slides use “augmentation” in more than one way. Questions specify whether a functional gene is added or a sequence is corrected.</li><li>The cystic-fibrosis text and illustration use different vector labels. Questions test CFTR and the delivery concept rather than that conflicting label.</li><li>The stem-cell source list mislabels periodontal ligament cells as SHED. Here, SHED consistently means cells from human exfoliated deciduous teeth.</li><li>Drug slides give differing trial enrollment ranges. Questions test a phase’s purpose and population rather than conflicting exact counts.</li><li>Historical cost estimates, predictions, and broad legal claims are not used as current facts in scored questions.</li><li>Research examples, including whole-tooth regeneration in mice, are presented as research examples rather than guaranteed clinical outcomes.</li><li>The cancer-stem-cell explanation follows the lecture model of treatment-resistant tumor-initiating cells; it does not assume every stem cell always resists chemotherapy.</li></ul></section>`;}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>navigate(b.dataset.view));
document.addEventListener('keydown',e=>{if(view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey||['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;const s=state.session,i=s.items[s.index];let n='asdf'.indexOf(e.key.toLowerCase());if(n<0)n='1234'.indexOf(e.key);if(n>=0){e.preventDefault();select(i.order[n]);}else if(e.key.toLowerCase()==='b'){e.preventDefault();toggleBookmark(i.id);}else if(e.key==='Enter'&&document.activeElement?.tagName!=='BUTTON'){e.preventDefault();if(s.mode==='practice'&&!i.checked)check();else if(s.index===s.items.length-1)finish();else move(1);}});
window.addEventListener('beforeunload',()=>{pausePractice();save();});
document.addEventListener('visibilitychange',()=>{if(state.session?.mode==='practice'&&view==='quiz'){if(document.hidden)pausePractice();else if(!state.session.finished)state.session.tick=Date.now();}});
setInterval(()=>{const s=state.session;if(!s||s.finished)return;if(s.timed&&Date.now()>=s.deadline){finish(true);return;}const clock=$('#clock');if(clock){const n=clockValue();clock.textContent=timeText(n);clock.classList.toggle('urgent',s.timed&&n<=300);}},1000);
save();render();

</script></body></html>
